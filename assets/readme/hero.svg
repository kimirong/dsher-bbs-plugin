<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">dsher-bbs-plugin — bbs.dsher.cn 社区面板</title>
  <desc id="desc">在 DeepSeek Harness 里逛 bbs.dsher.cn：一条命令安装后，页面右下角出现「dsher 社区」按钮，点开即可浏览、搜索、发帖、回帖、点赞、粘贴截图上传，并支持 GitHub / Google 一键登录。</desc>

  <defs>
    <linearGradient id="fab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6bcb"/>
      <stop offset="0.55" stop-color="#0969da"/>
      <stop offset="1" stop-color="#1f7ae0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>

  <!-- ── 左侧：标题 + 一键安装 ─────────────────────────────────────── -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 类别 eyebrow -->
    <text x="56" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="1" fill="#8b949e">bbs.dsher.cn · DSH COMMUNITY PLUGIN</text>

    <!-- logo 徽章 + 项目名 -->
    <rect x="56" y="92" width="56" height="56" rx="14" fill="#0969da"/>
    <text x="84" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bbs</text>
    <text x="132" y="134" font-size="60" font-weight="800" fill="#e6edf3">dsher-bbs-plugin</text>

    <!-- 一句话描述 -->
    <text x="56" y="196" font-size="24" fill="#e6edf3">在 DeepSeek Harness 里逛 bbs.dsher.cn 社区</text>
    <text x="56" y="230" font-size="24" fill="#e6edf3">浏览 · 搜索 · 发帖 · 点赞 · 粘贴截图 · 一键登录</text>

    <!-- 一键安装命令 -->
    <rect x="56" y="256" width="640" height="86" rx="12" fill="#161b22" stroke="#1f7ae0" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="80" y="292" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" fill="#e6edf3">$ dsh plugin --profile web add</text>
    <text x="80" y="324" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" fill="#1f7ae0">github:kimirong/dsher-bbs-plugin</text>

    <!-- 安装结果提示 -->
    <text x="56" y="376" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#8b949e">✓ 重启 dsh web 后，右下角出现「dsher 社区」悬浮按钮</text>
  </g>

  <!-- ── 右侧：面板 mockup（project proof） ────────────────────────── -->
  <g id="panel-proof">
    <!-- 面板卡片 -->
    <rect x="712" y="56" width="432" height="308" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

    <!-- 头部：logo + 标题 + ✕ -->
    <rect x="730" y="74" width="34" height="24" rx="6" fill="#ffffff"/>
    <text x="747" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bbs</text>
    <text x="778" y="90" font-size="20" font-weight="700" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsh 社区</text>
    <text x="778" y="107" font-size="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">bbs.dsher.cn</text>
    <text x="1120" y="92" font-size="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">✕</text>

    <!-- 登录按钮行 -->
    <rect x="730" y="128" width="178" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="819" y="150" text-anchor="middle" font-size="15" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">🔑 一键登录 (GitHub)</text>
    <rect x="918" y="128" width="170" height="32" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="1003" y="150" text-anchor="middle" font-size="15" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">🔑 一键登录 (Google)</text>

    <!-- 视图 tab：最新讨论 active + 版块 -->
    <rect x="730" y="174" width="112" height="32" rx="8" fill="#0969da"/>
    <text x="786" y="195" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">最新讨论</text>
    <rect x="852" y="174" width="72" height="32" rx="8" fill="none" stroke="#30363d"/>
    <text x="888" y="195" text-anchor="middle" font-size="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">版块</text>

    <!-- 帖子列表（真实标题） -->
    <text x="730" y="246" font-size="17" font-weight="600" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">仿 codex 风格时间线和归档管理插件</text>
    <text x="730" y="266" font-size="13" fill="#8b949e" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">~/bbs/plugin-dev · MLGBNB · 1 回复</text>
    <text x="730" y="302" font-size="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">建议：公告板块加 RSS + 站务讨论分区</text>
    <text x="730" y="322" font-size="13" fill="#8b949e" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">~/bbs/announce · kimirong · 0 回复</text>
    <line x1="730" y1="278" x2="1124" y2="278" stroke="#21262d" stroke-width="1.5"/>
    <line x1="730" y1="334" x2="1124" y2="334" stroke="#21262d" stroke-width="1.5"/>

    <!-- 右下角 FAB（motif：品牌蓝胶囊） -->
    <rect x="904" y="338" width="216" height="46" rx="23" fill="url(#fab)"/>
    <text x="1012" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsher 社区</text>
  </g>
</svg>
