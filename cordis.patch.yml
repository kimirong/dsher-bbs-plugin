# dsher-bbs-plugin · profile bundle patch layer
# 作为 @deepseek-ai/dsh 的 bundle 包（package.json 的 dsh.bundle.patch 声明）挂进
# 用户的 web profile：这一层把一个 host 行插入组合树。行 name 指向本包（main 导出
# 即 Host 半插件），Loader 按包名解析。
#
# 用户安装：dsh plugin --profile web add @kimirong/dsher-bbs-plugin
# （dsh plugin 会把声明了 dsh.bundle.patch 的依赖自动追加进 dsh.profile.bundles）
- insert:
    - id: dsher-bbs-plugin
      name: '@kimirong/dsher-bbs-plugin'
